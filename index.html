<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Scheme Analyzer</title>
    <style>
        :root {
            /* Clean Black & White Design System */
            --bg-color: #000000;
            --text-color: #ffffff;
            --container-bg: #111111;
            --border-color: #333333;
            --input-bg: #1a1a1a;
            --button-bg: #ffffff;
            --button-text: #000000;
            --accent-color: #ffffff;
            --shadow: rgba(255, 255, 255, 0.1);
            --hover-bg: #222222;
            --focus-ring: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.5;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: var(--hover-bg);
            color: var(--text-color);
        }

        .btn-icon {
            font-size: 0.875rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            margin-top: 0;
            border-top: none;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .theme-toggle:hover {
            opacity: 0.8;
        }

        .lyrics-search-section {
            margin-bottom: 24px;
            padding: 24px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .lyrics-search-section h3 {
            margin: 0 0 16px 0;
            color: var(--text-color);
            font-size: 1.125rem;
            font-weight: 600;
        }

        .search-inputs {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-inputs input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--container-bg);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .search-inputs input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .search-inputs input::placeholder {
            color: var(--accent-color);
            opacity: 0.6;
        }

        .search-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            line-height: 1.4;
        }

        .search-btn:hover {
            background: var(--hover-bg);
            color: var(--text-color);
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border-color);
        }

        .divider span {
            background-color: var(--container-bg);
            color: var(--accent-color);
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-group h3 {
            margin: 0 0 15px 0;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 240px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            resize: vertical;
            transition: all 0.2s ease;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea::placeholder {
            color: var(--accent-color);
            opacity: 0.6;
        }

        .button-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .sensitivity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--input-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sensitivity-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
            min-width: 80px;
        }

        .sensitivity-slider {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
        }

        .sensitivity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--button-bg);
            cursor: pointer;
            border: 2px solid var(--container-bg);
            box-shadow: 0 2px 4px var(--shadow);
        }

        .sensitivity-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--button-bg);
            cursor: pointer;
            border: 2px solid var(--container-bg);
            box-shadow: 0 2px 4px var(--shadow);
        }

        .sensitivity-value {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: 600;
            min-width: 40px;
        }

        .analyze-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            padding: 16px 32px;
            border: 1px solid var(--button-bg);
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .analyze-btn:hover {
            opacity: 0.9;
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output {
            margin-top: 40px;
            padding: 30px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: none;
            transition: all 0.3s ease;
        }

        /* Collapsible Section Styles */
        .collapsible-section {
            margin: 20px 0;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--container-bg);
        }

        .collapsible-header {
            padding: 15px 20px;
            background-color: var(--input-bg);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .collapsible-header:hover {
            background-color: var(--border-color);
        }

        .collapsible-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .collapsible-icon {
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .collapsible-content {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }

        .collapsible-section.open .collapsible-content {
            padding: 20px;
            max-height: 1000px;
        }

        .collapsible-section.open .collapsible-icon {
            transform: rotate(180deg);
        }

        /* Score Display Styles */
        .score-display {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, var(--accent-color), var(--button-bg));
            border-radius: 12px;
            color: white;
        }

        .overall-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .score-label {
            font-size: 1.1rem;
            margin: 5px 0 0 0;
            opacity: 0.9;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .score-metric {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .score-metric .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        .score-metric .label {
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        /* Statistics Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-top: 4px;
        }

        .output h3 {
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .line {
            margin-bottom: 20px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            font-size: 16px;
            line-height: 1.8;
            padding: 16px 20px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-color);
            border-radius: 8px;
        }

        .rhyme-group-summary {
            margin-top: 40px;
            padding: 30px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .rhyme-group-summary h4 {
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .group-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px 16px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .group-item:hover {
            border-color: var(--accent-color);
        }

        .group-label {
            font-weight: 700;
            font-size: 14px;
            margin-right: 20px;
            min-width: 35px;
            text-align: center;
            padding: 6px 10px;
            color: #ffffff;
            font-family: monospace;
            border-radius: 6px;
        }

        .group-words {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 14px;
            color: var(--text-color);
            flex: 1;
        }

        .rhyme-type-badge {
            font-size: 11px;
            padding: 4px 8px;
            margin-left: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid;
            border-radius: 4px;
        }

        .perfect-rhyme {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
        }

        .estimated-rhyme {
            background-color: #f59e0b;
            color: #ffffff;
            border-color: #f59e0b;
        }

        .error {
            color: #ef4444;
            background-color: var(--container-bg);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            font-weight: 500;
        }

        .rhyme-highlight {
            padding: 3px 6px;
            font-weight: 700;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            border-radius: 4px;
        }

        .rhyme-highlight:hover {
            border-color: var(--text-color);
        }

        /* Light mode highlighting colors */
        .rhyme-color-0 { background-color: #C0392B !important; color: #ffffff !important; }
        .rhyme-color-1 { background-color: #138D75 !important; color: #ffffff !important; }
        .rhyme-color-2 { background-color: #1F618D !important; color: #ffffff !important; }
        .rhyme-color-3 { background-color: #27AE60 !important; color: #ffffff !important; }
        .rhyme-color-4 { background-color: #F39C12 !important; color: #ffffff !important; }
        .rhyme-color-5 { background-color: #8E44AD !important; color: #ffffff !important; }
        .rhyme-color-6 { background-color: #16A085 !important; color: #ffffff !important; }
        .rhyme-color-7 { background-color: #D68910 !important; color: #ffffff !important; }
        .rhyme-color-8 { background-color: #7D3C98 !important; color: #ffffff !important; }
        .rhyme-color-9 { background-color: #2E86C1 !important; color: #ffffff !important; }
        .rhyme-color-10 { background-color: #E67E22 !important; color: #ffffff !important; }
        .rhyme-color-11 { background-color: #229954 !important; color: #ffffff !important; }
        .rhyme-color-12 { background-color: #CB4335 !important; color: #ffffff !important; }
        .rhyme-color-13 { background-color: #2874A6 !important; color: #ffffff !important; }
        .rhyme-color-14 { background-color: #A569BD !important; color: #ffffff !important; }
        .rhyme-color-15 { background-color: #148F77 !important; color: #ffffff !important; }

        /* Dark mode highlighting colors - more subtle with better contrast */
        [data-theme="dark"] .rhyme-color-0 { background-color: #8B2B2B !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-1 { background-color: #0F6B5C !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-2 { background-color: #1A4E73 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-3 { background-color: #1F8A4C !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-4 { background-color: #C2790F !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-5 { background-color: #6A3487 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-6 { background-color: #12806A !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-7 { background-color: #A86D0D !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-8 { background-color: #5F2C75 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-9 { background-color: #256A9A !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-10 { background-color: #B8591C !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-11 { background-color: #1C7542 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-12 { background-color: #9A342A !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-13 { background-color: #1F5A84 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-14 { background-color: #824A95 !important; color: #E8E8E8 !important; }
        [data-theme="dark"] .rhyme-color-15 { background-color: #0F6B5C !important; color: #E8E8E8 !important; }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            textarea {
                height: 200px;
                font-size: 14px;
                padding: 15px;
            }

            .analyze-btn {
                padding: 14px 24px;
                font-size: 14px;
            }

            .line {
                font-size: 14px;
                padding: 12px 15px;
            }

            .group-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .group-label {
                margin-right: 0;
            }

            .search-inputs {
                flex-direction: column;
                align-items: stretch;
            }

            .search-inputs input {
                min-width: auto;
            }

            .lyrics-search-section {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }

            .sensitivity-control {
                justify-content: center;
            }

            .sensitivity-slider {
                width: 100px;
            }
        }

        /* Timing Sync Styles */
        .timing-controls {
            margin-top: 15px;
        }

        .audio-upload-label {
            display: inline-block;
            background-color: var(--input-bg);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            color: var(--text-color);
            margin: 10px 0;
        }

        .audio-upload-label:hover {
            border-color: var(--accent-color);
            background-color: var(--container-bg);
        }

        .sync-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 15px;
        }

        .sync-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .sync-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sync-button-container {
            text-align: center;
            margin-top: 15px;
        }

        /* Audio Method Selector Styles */
        .audio-method-selector {
            margin: 20px 0;
        }

        .audio-method-selector h4 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .audio-method-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .audio-method-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .audio-method-btn:hover {
            border-color: var(--accent-color);
            background-color: var(--container-bg);
        }

        .audio-method-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .audio-search-status {
            text-align: center;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 8px;
            margin: 15px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .youtube-player-container {
            position: relative;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }

        #youtube-player {
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .player-overlay {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .audio-method-buttons {
                flex-direction: column;
            }

            .audio-method-btn {
                width: 100%;
            }
        }

        /* Fullscreen Presentation Mode */
        .fullscreen-presentation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            z-index: 10000;
            display: none;
            overflow: hidden;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
        }

        .presentation-content {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: left;
            width: 90vw;
            height: 100vh;
            overflow: hidden;
            padding: 100px 0;
            transition: transform 0.3s ease-out;
        }

        .presentation-line {
            font-size: 2.5rem;
            line-height: 1.6;
            margin: 25px 0;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: block;
        }

        .presentation-line.active {
            opacity: 1;
        }

        .presentation-line.current {
            opacity: 1;
            font-weight: 600;
        }

        .presentation-word {
            display: inline;
            transition: all 0.3s ease;
        }

        /* Highest priority presentation highlight - overrides everything */
        .fullscreen-presentation .karaoke-highlight,
        .karaoke-highlight {
            background: #ffffff !important;
            color: #000000 !important;
            padding: 4px 8px !important;
            border-radius: 0 !important;
            font-weight: 700 !important;
            border: 2px solid #ffffff !important;
            box-shadow: none !important;
            position: relative !important;
            transition: none !important;
            display: inline-block !important;
            z-index: 9999 !important;
        }

        .presentation-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .presentation-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .presentation-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 2px;
        }

        .presentation-content.zoomed-out {
            transition: transform 1s ease-out;
        }

        .presentation-line.timing-ended {
            opacity: 0.6;
            position: relative;
        }

        .presentation-line.timing-ended::after {
            content: "🎵 Audio continues...";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            opacity: 0.7;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .presentation-line {
                font-size: 1.8rem;
                margin: 15px 0;
            }

            .presentation-controls {
                bottom: 20px;
                padding: 10px 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .progress-bar {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Rhyme Scheme Analyzer</h1>
        <div class="header-controls">
            <button class="header-btn sync-mode-btn" onclick="toggleTimingMode()" id="syncModeToggle">
                <span class="btn-icon">🎵</span>
                <span class="btn-text">Sync Mode</span>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Lyrics Search Section -->
        <div class="lyrics-search-section">
            <h3>Search Song Lyrics</h3>
            <div class="search-inputs">
                <input type="text" id="artistInput" placeholder="Artist name (e.g., Eminem)" />
                <input type="text" id="songInput" placeholder="Song title (e.g., Lose Yourself)" />
                <button class="search-btn" id="searchBtn" onclick="searchLyrics()">Search Lyrics</button>
            </div>
        </div>

        <!-- Timed Lyrics Sync Section -->
        <div class="lyrics-search-section" id="timedLyricsSection" style="display: block;">
            <h3>🎵 Real-Time Sync Mode</h3>
            <div class="timing-controls">
                <div class="search-inputs">
                    <input type="text" id="timedArtistInput" placeholder="Artist name" />
                    <input type="text" id="timedSongInput" placeholder="Song title" />
                    <button class="search-btn" id="timedSearchBtn" onclick="searchTimedLyrics()">Get Timed Lyrics</button>
                </div>
                <div class="audio-controls" id="audioControls" style="display: none;">
                    <div class="audio-method-selector">
                        <h4>Choose Audio Source:</h4>
                        <div class="audio-method-buttons">
                            <button class="audio-method-btn active" id="autoAudioBtn" onclick="selectAudioMethod('auto')">
                                🎵 Auto Search YouTube
                            </button>
                            <button class="audio-method-btn" id="uploadAudioBtn" onclick="selectAudioMethod('upload')">
                                📁 Upload File
                            </button>
                        </div>
                    </div>

                    <div class="auto-audio-section" id="autoAudioSection">
                        <div class="audio-search-status" id="audioSearchStatus">
                            <span>🔍 Searching for audio...</span>
                        </div>
                        <div class="youtube-player-container" id="youtubePlayerContainer" style="display: none;">
                            <div id="youtube-player"></div>
                            <div class="player-overlay">
                                <span>YouTube Audio Player (Hidden)</span>
                            </div>
                        </div>
                    </div>

                    <div class="upload-audio-section" id="uploadAudioSection" style="display: none;">
                        <div class="audio-upload">
                            <label for="audioFile" class="audio-upload-label">
                                <span>📁 Upload Audio File (MP3, WAV)</span>
                                <input type="file" id="audioFile" accept="audio/*" style="display: none;" onchange="loadAudioFile(this)">
                            </label>
                        </div>
                    </div>

                    <div class="sync-button-container">
                        <button class="sync-btn" id="syncPlayBtn" onclick="startSyncPresentation()" disabled>
                            ▶️ Start Sync Presentation
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="input-group">
            <h3>Enter Text Manually</h3>
            <textarea id="textInput" placeholder="Paste your poem, rap lyrics, or any text here...">Tripping off the beat kinda, dripping off the meat grinder
Heat niner, pimping, stripping, soft sweet minor
China was a neat signer, trouble with the script
The magnificent different president, evident hesitant</textarea>
        </div>

        <div class="button-group">
            <div class="sensitivity-control">
                <label class="sensitivity-label" for="sensitivitySlider">Sensitivity:</label>
                <input type="range"
                       id="sensitivitySlider"
                       class="sensitivity-slider"
                       min="0"
                       max="100"
                       value="5"
                       oninput="updateSensitivity(this.value)"
                       onchange="reanalyzeWithSensitivity()">
                <span class="sensitivity-value" id="sensitivityValue">5%</span>
            </div>
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeRhymes()">Analyze Rhyme Scheme</button>
        </div>

        <div id="output" class="output">
            <h3>Rhyme Analysis Results</h3>

            <!-- Score Display Section -->
            <div class="score-display" id="scoreDisplay">
                <div class="overall-score" id="overallScore">--</div>
                <div class="score-label">Overall Rhyme Score</div>
                <div class="score-breakdown" id="scoreBreakdown"></div>
            </div>

            <!-- Statistics Collapsible Section -->
            <div class="collapsible-section" id="statsSection">
                <div class="collapsible-header" onclick="toggleSection('statsSection')">
                    <h3>Statistics & Metrics</h3>
                    <span class="collapsible-icon">▼</span>
                </div>
                <div class="collapsible-content">
                    <div class="stats-grid" id="statsGrid"></div>
                </div>
            </div>

            <!-- Rhyme Groups Collapsible Section -->
            <div class="collapsible-section" id="rhymeGroupsSection">
                <div class="collapsible-header" onclick="toggleSection('rhymeGroupsSection')">
                    <h3>Rhyme Groups</h3>
                    <span class="collapsible-icon">▼</span>
                </div>
                <div class="collapsible-content">
                    <div id="rhymeGroups"></div>
                </div>
            </div>

            <!-- Analysis Results (Always Open) -->
            <div style="margin: 20px 0;">
                <h3 style="margin-bottom: 20px; color: var(--text-color);">Highlighted Lyrics</h3>
                <div id="results"></div>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
    </div>

    <!-- Fullscreen Presentation Mode -->
    <div class="fullscreen-presentation" id="presentationMode">
        <div class="presentation-content">
            <div id="presentationLines"></div>
        </div>

        <div class="presentation-controls">
            <button class="presentation-btn" onclick="pausePresentation()" id="pauseBtn">⏸️ Pause</button>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="timeDisplay">00:00 / 00:00</span>
            <button class="presentation-btn" onclick="exitPresentation()">✖️ Exit</button>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="syncAudio" preload="metadata"></audio>

    <!-- YouTube iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        async function searchLyrics() {
            const artist = document.getElementById('artistInput').value.trim();
            const song = document.getElementById('songInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const textInput = document.getElementById('textInput');
            const errorDiv = document.getElementById('error');

            if (!artist || !song) {
                showError('Please enter both artist name and song title.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Searching...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/search-lyrics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ artist: artist, song: song })
                });

                const data = await response.json();

                if (data.success && data.lyrics) {
                    // Populate the text area with the found lyrics
                    textInput.value = data.lyrics;

                    // Show success message briefly
                    showError(`✓ Found lyrics for "${data.song}" by ${data.artist}. Click "Analyze Rhyme Scheme" below to analyze!`);
                    document.getElementById('error').style.backgroundColor = '#22c55e';
                    document.getElementById('error').style.borderColor = '#22c55e';
                    document.getElementById('error').style.color = '#ffffff';

                    // Clear inputs
                    document.getElementById('artistInput').value = '';
                    document.getElementById('songInput').value = '';
                } else {
                    showError(data.error || 'No lyrics found for this song. Please check the artist and song name.');
                }

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to search for lyrics. Make sure the server is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search Lyrics';
            }
        }

        // Global variables for timing sync
        let currentTimingData = null;
        let currentAnalysisData = null; // For karaoke presentation
        let mainAnalysisData = null;    // For main rhyme analysis
        let audioElement = null;
        let syncInterval = null;
        let isPaused = false;
        let youtubePlayer = null;
        let currentAudioMethod = 'auto';
        let lastSearchedArtist = '';
        let lastSearchedSong = '';

        // YouTube Player API Ready Callback
        function onYouTubeIframeAPIReady() {
            console.log('YouTube iframe API ready');
            window.youtubeAPIReady = true;
        }

        function selectAudioMethod(method) {
            currentAudioMethod = method;

            // Update button states
            document.getElementById('autoAudioBtn').classList.toggle('active', method === 'auto');
            document.getElementById('uploadAudioBtn').classList.toggle('active', method === 'upload');

            // Show/hide sections
            document.getElementById('autoAudioSection').style.display = method === 'auto' ? 'block' : 'none';
            document.getElementById('uploadAudioSection').style.display = method === 'upload' ? 'block' : 'none';

            // If switching to auto mode and we have search data, search for audio
            if (method === 'auto' && lastSearchedArtist && lastSearchedSong) {
                searchYouTubeAudio(lastSearchedArtist, lastSearchedSong);
            }

            console.log('Audio method selected:', method);
        }

        async function searchYouTubeAudio(artist, song) {
            const statusDiv = document.getElementById('audioSearchStatus');
            statusDiv.innerHTML = '<span>🔍 Searching YouTube for audio...</span>';

            try {
                const searchQuery = `${artist} ${song}`;
                console.log('Searching YouTube for:', searchQuery);

                // Simulate search delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Search for video ID based on artist and song
                const videoId = await getYouTubeVideoId(artist, song);

                if (videoId) {
                    statusDiv.innerHTML = `<span>✅ Found audio: "${song}" by ${artist}</span>`;
                    loadYouTubePlayer(videoId);
                } else {
                    statusDiv.innerHTML = `<span>❌ No audio found for "${song}" by ${artist}. Try uploading a file or use a different song.</span>`;
                    // Don't auto-switch to upload mode, let user decide
                    console.warn('No matching video found for:', artist, song);

                    // Show available songs as suggestions
                    const availableSongs = getAvailableSongs();
                    if (availableSongs.length > 0) {
                        statusDiv.innerHTML += `<br><small>💡 Try these songs: ${availableSongs.slice(0, 3).join(', ')}</small>`;
                    }
                }

            } catch (error) {
                console.error('YouTube search error:', error);
                statusDiv.innerHTML = '<span>❌ YouTube search failed. Try uploading a file.</span>';
            }
        }

        function getAvailableSongs() {
            // Return a list of available demo songs for suggestions
            return [
                'Eminem - Lose Yourself',
                'Ed Sheeran - Shape of You',
                'Drake - God\'s Plan',
                'Taylor Swift - Shake It Off',
                'Billie Eilish - Bad Guy',
                'The Weeknd - Blinding Lights'
            ];
        }

        async function getYouTubeVideoId(artist, song) {
            console.log('Searching for video ID via API:', artist, song);

            try {
                // Call our backend API for YouTube search
                const response = await fetch('/search-audio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        artist: artist,
                        song: song
                    })
                });

                const data = await response.json();
                console.log('Audio search response:', data);

                if (data.success && data.video_id) {
                    console.log(`✓ Found video via ${data.source}:`, data.video_id);
                    return data.video_id;
                } else {
                    console.warn('No video found via API:', data.error);
                    return null;
                }
            } catch (error) {
                console.error('API search failed:', error);
                return null;
            }
        }

        function loadYouTubePlayer(videoId) {
            console.log('Loading YouTube player with video ID:', videoId);

            const playerContainer = document.getElementById('youtubePlayerContainer');
            playerContainer.style.display = 'block';

            // Initialize YouTube player
            if (window.YT && window.YT.Player) {
                youtubePlayer = new YT.Player('youtube-player', {
                    height: '0',
                    width: '0',
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 0,
                        'controls': 0,
                        'disablekb': 1,
                        'enablejsapi': 1,
                        'fs': 0,
                        'iv_load_policy': 3,
                        'modestbranding': 1,
                        'rel': 0,
                        'showinfo': 0
                    },
                    events: {
                        'onReady': onYouTubePlayerReady,
                        'onStateChange': onYouTubePlayerStateChange
                    }
                });
            } else {
                // API not ready yet, wait and retry
                setTimeout(() => loadYouTubePlayer(videoId), 500);
            }
        }

        function onYouTubePlayerReady(event) {
            console.log('YouTube player ready');
            audioElement = {
                play: () => youtubePlayer.playVideo(),
                pause: () => youtubePlayer.pauseVideo(),
                get currentTime() { return youtubePlayer.getCurrentTime(); },
                set currentTime(time) { youtubePlayer.seekTo(time, true); },
                get duration() { return youtubePlayer.getDuration(); },
                get ended() { return youtubePlayer.getPlayerState() === YT.PlayerState.ENDED; }
            };

            // Enable sync button
            document.getElementById('syncPlayBtn').disabled = false;
        }

        function onYouTubePlayerStateChange(event) {
            // Handle player state changes if needed
            console.log('YouTube player state changed:', event.data);
        }

        async function searchTimedLyrics() {
            console.log('searchTimedLyrics function called');

            const artist = document.getElementById('timedArtistInput').value.trim();
            const song = document.getElementById('timedSongInput').value.trim();
            const btn = document.getElementById('timedSearchBtn');
            const errorDiv = document.getElementById('error');

            console.log('Search params:', { artist, song });

            if (!artist || !song) {
                showError('Please enter both artist name and song title for timing sync.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Searching...';
            errorDiv.style.display = 'none';

            try {
                console.log('Making fetch request to /search-timed-lyrics...');

                const response = await fetch('/search-timed-lyrics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ artist: artist, song: song })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', { success: data.success, hasTimingData: !!data.timing_data, error: data.error });

                if (data.success && data.timing_data) {
                    currentTimingData = data.timing_data;
                    lastSearchedArtist = data.artist;
                    lastSearchedSong = data.song;
                    console.log('Loaded timing data with', data.timing_data.length, 'items');

                    // Populate text area with the lyrics text
                    const lyricsText = data.timing_data.map(item => item.text).join('\n');
                    document.getElementById('textInput').value = lyricsText;

                    // Show audio controls
                    document.getElementById('audioControls').style.display = 'block';

                    // Auto-search for YouTube audio if in auto mode
                    if (currentAudioMethod === 'auto') {
                        searchYouTubeAudio(data.artist, data.song);
                    }

                    // Show success message
                    showError(`✓ Found timed lyrics for "${data.song}" by ${data.artist}. Searching for audio...`);
                    document.getElementById('error').style.backgroundColor = '#22c55e';
                    document.getElementById('error').style.borderColor = '#22c55e';
                    document.getElementById('error').style.color = '#ffffff';

                    // Clear inputs
                    document.getElementById('timedArtistInput').value = '';
                    document.getElementById('timedSongInput').value = '';

                } else {
                    console.log('Search failed:', data.error);
                    showError(data.error || 'No timed lyrics found for this song. Try different search terms.');
                }

            } catch (error) {
                console.error('Search error:', error);
                showError('Failed to search for timed lyrics. Make sure the server is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get Timed Lyrics';
            }
        }

        function loadAudioFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                audioElement = document.getElementById('syncAudio');

                // Create object URL for local file
                const audioURL = URL.createObjectURL(file);
                audioElement.src = audioURL;

                audioElement.onloadedmetadata = function() {
                    // Enable the sync button once audio is loaded
                    document.getElementById('syncPlayBtn').disabled = false;
                    showError(`✓ Audio file loaded: ${file.name}. Ready to start sync presentation!`);
                    document.getElementById('error').style.backgroundColor = '#22c55e';
                    document.getElementById('error').style.borderColor = '#22c55e';
                    document.getElementById('error').style.color = '#ffffff';
                };

                audioElement.onerror = function() {
                    showError('Failed to load audio file. Please try a different audio format.');
                };
            }
        }

        async function startSyncPresentation() {
            if (!currentTimingData || !audioElement) {
                showError('Please load timed lyrics and audio file first.');
                return;
            }

            // Check if we have existing analysis to reuse
            if (mainAnalysisData) {
                console.log('🎯 Reusing existing rhyme analysis for karaoke mode');
                currentAnalysisData = mainAnalysisData;
                showFullscreenPresentation();
                return;
            }

            // If no existing analysis, check if current text matches timing data
            const lyricsText = currentTimingData.map(item => item.text).join('\n');
            const currentText = document.getElementById('textInput').value.trim();

            if (currentText && currentText === lyricsText) {
                showError('Please click "Analyze Rhyme Scheme" first to generate the rhyme analysis.');
                return;
            }

            // As fallback, analyze the lyrics for rhyme patterns
            console.log('⚠️ No existing analysis found, generating new one...');
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: lyricsText,
                        sensitivity: parseInt(document.getElementById('sensitivitySlider').value)
                    })
                });

                currentAnalysisData = await response.json();
                console.log('✅ Generated fallback analysis for karaoke mode');

                // Show fullscreen presentation
                showFullscreenPresentation();

            } catch (error) {
                console.error('Error analyzing lyrics:', error);
                showError('Failed to analyze lyrics for presentation.');
            }
        }

        function showFullscreenPresentation() {
            const presentationMode = document.getElementById('presentationMode');
            const presentationLines = document.getElementById('presentationLines');

            // Clear any existing content
            presentationLines.innerHTML = '';

            // Create ALL presentation lines at once (karaoke style - all visible from start)
            currentTimingData.forEach((timingItem, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'presentation-line';
                lineDiv.id = `line-${index}`;
                lineDiv.dataset.timestamp = timingItem.timestamp;

                // Split text into words for individual highlighting
                const words = timingItem.text.split(' ');
                const wordsHTML = words.map((word, wordIndex) => {
                    const cleanWord = word.replace(/[.,!?;:]/g, '');
                    return `<span class="presentation-word" id="word-${index}-${wordIndex}" data-word="${cleanWord}">${word}</span>`;
                }).join(' ');

                lineDiv.innerHTML = wordsHTML;
                presentationLines.appendChild(lineDiv);
            });

            // Show presentation
            presentationMode.style.display = 'block';

            // Start audio and sync
            audioElement.currentTime = 0;
            audioElement.play();
            isPaused = false;

            startKaraokeSync();
        }

        function startKaraokeSync() {
            let currentLineIndex = 0;
            let nextTimestamp = currentTimingData[0]?.timestamp || 0;
            const presentationContent = document.querySelector('.presentation-content');
            let hasInitialScrolled = false;

            syncInterval = setInterval(() => {
                if (isPaused || !audioElement) {
                    console.log('⏸️ Sync paused:', {isPaused, audioElement: !!audioElement});
                    return;
                }

                const currentTime = audioElement.currentTime * 1000; // Convert to milliseconds
                const duration = audioElement.duration * 1000;

                // Check for audio errors or corruption
                if (!audioElement.duration || audioElement.duration === 0) {
                    console.warn('⚠️ Audio duration is 0 or undefined');
                    return;
                }

                // Update progress bar
                const progress = (currentTime / duration) * 100;
                document.getElementById('progressFill').style.width = `${Math.min(progress, 100)}%`;

                // Update time display
                const current = formatTime(audioElement.currentTime);
                const total = formatTime(audioElement.duration);
                document.getElementById('timeDisplay').textContent = `${current} / ${total}`;

                // Debug timing info (every 5 seconds to reduce spam)
                if (Math.floor(currentTime / 5000) !== Math.floor((currentTime - 50) / 5000)) {
                    console.log(`🎵 Sync: ${currentTime.toFixed(0)}ms | Line: ${currentLineIndex}/${currentTimingData.length} | Next: ${nextTimestamp} | Duration: ${duration.toFixed(0)}ms`);
                }

                // Check if we should highlight the next line
                if (currentLineIndex < currentTimingData.length && currentTime >= nextTimestamp) {
                    const timingItem = currentTimingData[currentLineIndex];
                    const currentLine = document.getElementById(`line-${currentLineIndex}`);

                    console.log(`✨ Activating line ${currentLineIndex}: "${timingItem.text}"`);

                    // Remove current class from previous line
                    document.querySelectorAll('.presentation-line.current').forEach(line => {
                        line.classList.remove('current');
                    });

                    // Add current class to current line
                    if (currentLine) {
                        currentLine.classList.add('current');

                        // Smooth scroll to keep current line centered
                        const lineHeight = currentLine.offsetHeight + 25; // including margin
                        const containerHeight = window.innerHeight;
                        const scrollPosition = -(currentLineIndex * lineHeight - containerHeight / 2 + lineHeight / 2);

                        presentationContent.style.transform = `translateX(-50%) translateY(${scrollPosition}px)`;

                        // Add rhyme highlighting to words abruptly
                        highlightRhymingWordsAbrupt(currentLineIndex, timingItem.text);
                    }

                    currentLineIndex++;
                    nextTimestamp = currentTimingData[currentLineIndex]?.timestamp || Infinity;
                }

                // When audio actually ends (not just paused), zoom out to show entire scheme
                // But only if we're really near the end (within 3 seconds) or audio has truly ended
                const timeRemaining = duration - currentTime;
                if ((audioElement.ended && !audioElement.seeking) || timeRemaining <= 3000) {
                    if (currentLineIndex >= currentTimingData.length || audioElement.ended) {
                        console.log(`🏁 Audio ending (${timeRemaining.toFixed(0)}ms remaining), showing full scheme`);
                        clearInterval(syncInterval);
                        zoomOutToFullScheme();
                    }
                }

                // Safety check: if we've gone through all timing data but audio is still playing
                if (currentLineIndex >= currentTimingData.length && timeRemaining > 10000) {
                    // Show a message that timing data has ended but audio continues
                    const timingEndTime = Math.floor(currentTime / 1000);
                    const totalTime = Math.floor(duration / 1000);

                    if (Math.floor(currentTime / 10000) !== Math.floor((currentTime - 50) / 10000)) {
                        console.log(`📜 Timing data ended at ${timingEndTime}s, but audio continues to ${totalTime}s (${timeRemaining.toFixed(0)}ms remaining)`);
                    }

                    // Keep the last line visible and highlighted
                    const lastLine = document.querySelector('.presentation-line.current');
                    if (lastLine) {
                        lastLine.classList.add('timing-ended');
                    }

                    // Continue playing without new highlights
                }
            }, 50); // Update every 50ms for smooth sync
        }

        function highlightRhymingWordsAbrupt(lineIndex, lineText) {
            if (!currentAnalysisData?.syllable_highlights) return;

            // Find matching highlights for this line
            const words = lineText.split(' ');
            words.forEach((word, wordIndex) => {
                const wordElement = document.getElementById(`word-${lineIndex}-${wordIndex}`);
                if (!wordElement) return;

                const cleanWord = word.replace(/[.,!?;:()\[\]"']/g, '').toLowerCase();

                // Look for rhyme data for this word - be more strict about matching
                Object.values(currentAnalysisData.syllable_highlights).forEach(highlight => {
                    const highlightWord = highlight.word.toLowerCase();
                    // Only highlight if it's an exact match
                    if (highlightWord === cleanWord) {
                        // First, remove ALL existing classes that might conflict
                        wordElement.className = 'presentation-word';

                        // Remove any existing styles that might conflict
                        wordElement.removeAttribute('style');

                        // Get the rhyme group color from the highlight data
                        const backgroundColor = highlight.syllables?.[0]?.color || '#ff6b6b';

                        // Apply our karaoke highlight with the proper color
                        wordElement.classList.add('karaoke-highlight');

                        // Force inline styles with the rhyme group color
                        wordElement.setAttribute('style', `
                            background: ${backgroundColor} !important;
                            color: #ffffff !important;
                            padding: 4px 8px !important;
                            border-radius: 0 !important;
                            font-weight: 700 !important;
                            border: 2px solid ${backgroundColor} !important;
                            box-shadow: none !important;
                            display: inline-block !important;
                            position: relative !important;
                            z-index: 9999 !important;
                        `);

                        console.log(`✅ Karaoke highlighting: ${cleanWord} with color ${backgroundColor} at line ${lineIndex}, word ${wordIndex}`, wordElement);
                    }
                });
            });
        }

        function zoomOutToFullScheme() {
            console.log('🔍 Zooming out to show full rhyme scheme');
            const presentationContent = document.querySelector('.presentation-content');

            // Calculate the total height of all lines
            const lines = document.querySelectorAll('.presentation-line');
            let totalHeight = 0;
            lines.forEach(line => {
                totalHeight += line.offsetHeight + 25; // including margin
            });

            // Calculate scale to fit all content
            const containerHeight = window.innerHeight - 200; // leave space for controls
            const scale = Math.min(1, containerHeight / totalHeight);

            console.log(`📏 Zoom scale: ${scale}, total height: ${totalHeight}px`);

            // Apply zoom out transformation
            presentationContent.style.transform = `translateX(-50%) translateY(${-totalHeight/4}px) scale(${scale})`;

            // Add a class to show this is the final view
            presentationContent.classList.add('zoomed-out');

            // Show all lines at once for the finale
            lines.forEach(line => {
                line.classList.add('current');
            });

            // Auto-exit after showing full scheme for 5 seconds (increased from 3)
            setTimeout(() => {
                console.log('👋 Exiting presentation after zoom out');
                exitPresentation();
            }, 5000);
        }

        function pausePresentation() {
            if (audioElement) {
                if (isPaused) {
                    audioElement.play();
                    document.getElementById('pauseBtn').textContent = '⏸️ Pause';
                    isPaused = false;
                } else {
                    audioElement.pause();

        function exitPresentation() {
            const presentationMode = document.getElementById('presentationMode');
            const presentationContent = document.querySelector('.presentation-content');

            presentationMode.style.display = 'none';

            // Reset presentation state
            if (presentationContent) {
                presentationContent.style.transform = 'translateX(-50%)';
                presentationContent.classList.remove('zoomed-out');
            }

            // Clear all line states
            document.querySelectorAll('.presentation-line').forEach(line => {
                line.classList.remove('current', 'active');
            });

            // Clear all highlight states
            document.querySelectorAll('.karaoke-highlight').forEach(word => {
                word.classList.remove('karaoke-highlight');
                word.removeAttribute('style');
                word.className = 'presentation-word';
            });

            if (audioElement) {
                audioElement.pause();
                audioElement.currentTime = 0;
            }
            if (youtubePlayer && youtubePlayer.pauseVideo) {
                youtubePlayer.pauseVideo();
                youtubePlayer.seekTo(0);
            }

            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }

            isPaused = false;
        }

            const mins = Math.floor(seconds / 60);

        async function analyzeRhymes() {
            const text = document.getElementById('textInput').value.trim();
            const sensitivity = document.getElementById('sensitivitySlider').value;
            const btn = document.getElementById('analyzeBtn');
            const output = document.getElementById('output');
            const results = document.getElementById('results');
            const errorDiv = document.getElementById('error');

            if (!text) {
                showError('Please enter some text to analyze.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            output.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        sensitivity: parseInt(sensitivity)
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Store the analysis globally for reuse in karaoke mode
                mainAnalysisData = data;
                console.log('✅ Main analysis completed and stored', mainAnalysisData);

                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to analyze text. Make sure the Python server is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze Rhyme Scheme';
            }
        }

        function renderWordWithSyllableHighlights(originalWord, syllableData, rhymeGroups) {
            // Break down the word into actual syllables and highlight each one individually
            const syllables = syllableData.syllables;

            if (!syllables || syllables.length === 0) {
                return originalWord;
            }

            // For now, use a simple approach to estimate syllable boundaries in the text
            // This is a simplified syllable splitting - in a production system, you'd want
            // more sophisticated phoneme-to-text alignment
            const estimatedSyllables = estimateSyllableBoundaries(originalWord, syllables.length);

            let result = '';

            for (let i = 0; i < syllables.length; i++) {
                const syllable = syllables[i];
                const syllableText = estimatedSyllables[i] || '';

                if (syllable.rhyme_group && syllable.color) {
                    // This syllable is part of a rhyme group - highlight it
                    const group = rhymeGroups[syllable.rhyme_group];

                    let styleExtra = '';
                    let titleText = `Rhyme group ${group?.letter || 'Unknown'}`;

                    if (group?.rhyme_type?.includes('slant')) {
                        styleExtra = 'border: 1px dashed rgba(0,0,0,0.4);';
                        titleText += ' (slant rhyme)';
                    } else if (group?.rhyme_type?.includes('strong')) {
                        titleText += ' (strong rhyme)';
                    } else if (group?.rhyme_type?.includes('perfect')) {
                        titleText += ' (perfect rhyme)';
                    }

                    if (group?.syllable_count > 1) {
                        titleText += ` - ${group.syllable_count} syllables`;
                    }

                    result += `<span class="syllable-highlight" style="background-color: ${syllable.color}; color: #000000; padding: 0px 1px; border-radius: 2px; font-weight: bold; ${styleExtra}" title="${titleText}">${syllableText}</span>`;
                } else {
                    // Non-rhyming syllable - render normally
                    result += syllableText;
                }
            }

            return result || originalWord; // Fallback to original word if syllable breakdown fails
        }

        function estimateSyllableBoundaries(word, syllableCount) {
            // More sophisticated syllable boundary estimation
            if (syllableCount <= 1) {
                return [word];
            }

            // Handle common patterns and prefixes/suffixes
            const commonPatterns = {
                // Common endings that form their own syllables
                'ing': 1, 'tion': 1, 'sion': 1, 'ness': 1, 'ment': 1,
                'ful': 1, 'less': 1, 'able': 1, 'ible': 1, 'ous': 1,
                'er': 1, 'est': 1, 'ly': 1, 'ed': 1, 'en': 1
            };

            // Check for common endings first
            let endingSyllables = [];
            let remainingWord = word.toLowerCase();

            for (const [ending, sylCount] of Object.entries(commonPatterns)) {
                if (remainingWord.endsWith(ending) && remainingWord.length > ending.length) {
                    endingSyllables.unshift(word.slice(-ending.length));
                    remainingWord = remainingWord.slice(0, -ending.length);
                    syllableCount--;
                    break;
                }
            }

            if (syllableCount <= 1) {
                return [word.slice(0, remainingWord.length), ...endingSyllables];
            }

            // Find vowel clusters for remaining syllables
            const vowelClusters = [];
            const vowelPattern = /[aeiouAEIOU]+/g;
            let match;

            while ((match = vowelPattern.exec(remainingWord)) !== null) {
                vowelClusters.push({
                    start: match.index,
                    end: match.index + match[0].length,
                    vowel: match[0]
                });
            }

            if (vowelClusters.length <= 1) {
                return [word.slice(0, remainingWord.length), ...endingSyllables];
            }

            // More intelligent boundary detection
            const boundaries = [0];

            for (let i = 0; i < syllableCount - 1 && i < vowelClusters.length - 1; i++) {
                const currentVowel = vowelClusters[i];
                const nextVowel = vowelClusters[i + 1];

                // Find consonants between vowels
                const consonantStart = currentVowel.end;
                const consonantEnd = nextVowel.start;
                const consonantLength = consonantEnd - consonantStart;

                let boundary;
                if (consonantLength === 0) {
                    // No consonants between vowels
                    boundary = currentVowel.end;
                } else if (consonantLength === 1) {
                    // Single consonant - goes with next syllable
                    boundary = consonantStart;
                } else {
                    // Multiple consonants - split them
                    boundary = consonantStart + Math.floor(consonantLength / 2);
                }

                boundaries.push(boundary);
            }

            boundaries.push(remainingWord.length);

            // Create syllables from boundaries
            const syllables = [];
            for (let i = 0; i < boundaries.length - 1; i++) {
                const syllable = word.substring(boundaries[i], boundaries[i + 1]);
                if (syllable) {
                    syllables.push(syllable);
                }
            }

            return [...syllables, ...endingSyllables];
        }

        function displayRhymeGroups(groups) {
            const rhymeGroups = document.getElementById('rhymeGroups');

        function displayResults(data) {
            const results = document.getElementById('results');
            const output = document.getElementById('output');

            results.innerHTML = '';

            // Display score if available
            if (data.score) {
                displayScore(data.score);
                displayStatistics(data.score.statistics);
                displayRhymeGroups(data.groups);
            }

            // Update colors based on current theme
            const themeColors = getThemeColors();
            const textColor = getTextColor();
            let colorIndex = 0;

            // Reassign colors to rhyme groups based on current theme
            for (const group of Object.values(data.rhyme_groups)) {
                group.color = themeColors[colorIndex % themeColors.length];
                group.textColor = textColor;
                colorIndex++;
            }

            // Display lines with syllable-level highlighting
            data.lines.forEach((line, lineIndex) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'line';
                lineDiv.style.marginBottom = '15px';
                lineDiv.style.lineHeight = '1.6';

                const words = line.split(/(\s+)/); // Keep spaces
                let highlightedLine = '';
                let currentWordIndex = 0;

                words.forEach(word => {
                    if (/^\s+$/.test(word)) {
                        // It's whitespace, keep as is
                        highlightedLine += word;
                    } else {
                        // Find syllable highlights for this word
                        const wordKey = `${lineIndex}_${currentWordIndex}`;
                        const syllableData = data.syllable_highlights && data.syllable_highlights[wordKey];

                        if (syllableData && syllableData.syllables) {
                            // Render word with syllable-level highlighting
                            highlightedLine += renderWordWithSyllableHighlights(word, syllableData, data.rhyme_groups);
                        } else {
                            // No syllable data, render as plain text
                            highlightedLine += word;
                        }
                        currentWordIndex++;
                    }
                });

                lineDiv.innerHTML = highlightedLine;
                results.appendChild(lineDiv);
            });

            // Add rhyme group summary
            if (Object.keys(data.rhyme_groups).length > 0) {
                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'rhyme-group-summary';
                summaryDiv.innerHTML = '<h4>Rhyme Groups Found:</h4>';

                Object.values(data.rhyme_groups).forEach(group => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'group-item';

                    // Determine rhyme type and styling
                    let rhymeTypeBadge = '';
                    let badgeClass = '';

                    if (group.rhyme_type === 'perfect' || group.type === 'phonetic') {
                        badgeClass = 'perfect-rhyme';
                        rhymeTypeBadge = 'perfect';
                    } else if (group.rhyme_type === 'estimated' || group.type === 'text_based') {
                        badgeClass = 'estimated-rhyme';
                        rhymeTypeBadge = 'estimated';
                    } else if (group.rhyme_type === 'mixed') {
                        badgeClass = 'estimated-rhyme';
                        rhymeTypeBadge = 'mixed';
                    } else if (group.type === 'multisyllabic') {
                        badgeClass = 'perfect-rhyme';
                        rhymeTypeBadge = 'multisyllabic';
                    }

                    // Get word display with syllable highlighting
                    let wordDisplay;
                    if (group.syllable_info) {
                        // Create highlighted word display showing rhyming syllables
                        wordDisplay = group.words.map(word => {
                            const wordKey = `${word.line_index}_${word.word_index}`;
                            const syllableInfo = group.syllable_info[wordKey];

                            if (syllableInfo) {
                                // Highlight the rhyming syllable within the word
                                const syllableText = syllableInfo.syllable_text;
                                const wordText = word.clean;

                                // Find the syllable in the word and highlight it
                                const syllableLower = syllableText.toLowerCase();
                                const wordLower = wordText.toLowerCase();
                                const syllableIndex = wordLower.indexOf(syllableLower);

                                if (syllableIndex >= 0) {
                                    const before = wordText.substring(0, syllableIndex);
                                    const highlighted = wordText.substring(syllableIndex, syllableIndex + syllableText.length);
                                    const after = wordText.substring(syllableIndex + syllableText.length);

                                    return `${before}<span style="background-color: ${group.color}; color: white; padding: 1px 2px; border-radius: 2px; font-weight: bold;">${highlighted}</span>${after}`;
                                }
                            }

                            return word.clean;
                        }).join(', ');
                    } else if (group.type === 'multisyllabic') {
                        wordDisplay = group.words.map(w => w.rhyme_part || w.clean).join(', ');
                    } else {
                        wordDisplay = group.words.map(w => w.clean).join(', ');
                    }

                    // Limit word display length for readability
                    if (wordDisplay.length > 60) {
                        const words = wordDisplay.split(', ');
                        if (words.length > 8) {
                            wordDisplay = words.slice(0, 8).join(', ') + ` ... (+${words.length - 8} more)`;
                        }
                    }

                    groupDiv.innerHTML = `
                        <span class="group-label" style="background-color: ${group.color};">
                            ${group.letter}
                        </span>
                        <span class="group-words">${wordDisplay}</span>
                        <span class="rhyme-type-badge ${badgeClass}">${rhymeTypeBadge}</span>
                    `;
                    summaryDiv.appendChild(groupDiv);
                });

                results.appendChild(summaryDiv);
            }

            output.style.display = 'block';
        }

        // Color palettes for light and dark modes

            '#C0392B', '#138D75', '#F39C12', '#8E44AD', '#27AE60', '#1F618D',

        function getThemeColors() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            return isDark ? darkModeColors : lightModeColors;

        function getTextColor() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            return isDark ? '#E8E8E8' : '#ffffff';
        }

        // Dark mode toggle
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const toggle = document.querySelector('.theme-toggle');
            toggle.textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';

            // Re-analyze if results are shown to update colors
            const output = document.getElementById('output');
            if (output.style.display === 'block') {
                analyzeRhymes();
            }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);

            const toggle = document.querySelector('.theme-toggle');
            toggle.textContent = savedTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
